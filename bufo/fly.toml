app = "bufo-picker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"
  build-target = "public"

[env]
  BUFO_MODE = "public"
  BUFO_PUBLIC_ORIGIN = "https://bufo-picker.fly.dev"
  BUFO_DATA_DIR = "/data"
  BUFO_CATALOG_DIR = "/app/public-assets"
  BUFO_DAILY_TOKEN_LIMIT = "25000000"
  JEV_PROVIDER = "typesafe"
  PORT = "4318"

[[mounts]]
  source = "bufo_data"
  destination = "/data"

[http_service]
  internal_port = 4318
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

    [http_service.checks.headers]
      Host = "bufo-picker.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
