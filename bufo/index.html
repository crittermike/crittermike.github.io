<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Bufo</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>bufo.</h1>
    <label class="visually-hidden" for="message">Your message</label>
    <textarea id="message" rows="5" maxlength="2000" placeholder="Type a message. Find a bufo." aria-describedby="privacy-note" disabled></textarea>
    <p id="privacy-note">Your message and emoji names are sent to Jev.</p>
    <div class="feedback">
      <p id="status" role="status" aria-live="polite">Loading...</p>
      <button id="retry" type="button" hidden>Retry</button>
    </div>
    <section id="results" aria-label="Suggested emojis" aria-busy="false"></section>
    <div id="manual-copy" hidden>
      <label for="copy-code">Copy this code:</label>
      <input id="copy-code" type="text" readonly>
    </div>
    <p id="copy-status" role="status" aria-live="polite"></p>
  </main>
  <noscript>Enable JavaScript to find bufos.</noscript>
</body>
</html>
