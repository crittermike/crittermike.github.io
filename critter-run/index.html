<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Critter Run</title>
<meta name="theme-color" content="#1b1f4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffb300'/%3E%3Cpath d='M18 46 L32 14 L46 46 Z' fill='%231b1f4a'/%3E%3Ccircle cx='32' cy='38' r='6' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --body: Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --display: "Lilita One", Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif;
    --ink: #1b1f4a; --pad: max(12px, env(safe-area-inset-top));
    --green: #2fd24f; --green-d: #15912c; --yellow: #ffc61a; --yellow-d: #c98600; --blue: #2f8cff; --blue-d: #1557b8;
    --red: #ff4b4b; --red-d: #b8232a; --purple: #8a5cff; --purple-d: #5a33b8; --grey: #a9b2c6; --grey-d: #6f7891;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f4a; }
  body { font-family: var(--body); color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  [hidden] { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: 0; color: inherit; background: none; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .ic { width: 1em; height: 1em; fill: currentColor; flex: none; display: inline-block; vertical-align: middle; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--pad) 16px max(16px, env(safe-area-inset-bottom)); }
  .display { font-family: var(--display); font-weight: 400; letter-spacing: .5px; }
  .shout { font-family: var(--display); color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }

  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 65% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(4px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes drop { from { transform: translateY(-140%); } to { transform: none; } }
  @keyframes rise { from { transform: translateY(140%); } to { transform: none; } }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shine { 0% { transform: translateX(-120%) skewX(-20deg); } 60%, 100% { transform: translateX(260%) skewX(-20deg); } }

  /* chunky game buttons: bright face, dark outline, a thick lip underneath */
  .btn { --c: var(--green); --d: var(--green-d); position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .35em;
    font-family: var(--display); font-size: 30px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.28); letter-spacing: .5px;
    min-height: 64px; padding: 0 26px; border-radius: 22px; border: 3px solid var(--ink);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 72%, #fff) 0%, var(--c) 45%, var(--c) 100%);
    box-shadow: inset 0 -6px 0 var(--d), inset 0 3px 0 rgba(255,255,255,.45), 0 6px 0 var(--ink), 0 12px 18px rgba(0,0,0,.25);
    transition: transform .08s; overflow: hidden; }
  .btn::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-120%) skewX(-20deg); pointer-events: none; }
  .btn.shiny::after { animation: shine 2.6s ease-in-out infinite 1s; }
  .btn:active { transform: translateY(4px); box-shadow: inset 0 -4px 0 var(--d), inset 0 3px 0 rgba(255,255,255,.45), 0 2px 0 var(--ink), 0 6px 10px rgba(0,0,0,.25); }
  .btn .ic { font-size: 1.15em; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
  .btn.big { font-size: 40px; min-height: 84px; padding: 0 40px; border-radius: 28px; }
  .btn.round { width: 64px; min-height: 64px; height: 64px; padding: 0; border-radius: 50%; }
  .btn.square { width: 64px; height: 64px; padding: 0; }
  .btn.small { font-size: 22px; min-height: 52px; height: 52px; padding: 0 16px; border-radius: 18px; }
  .btn.small.square, .btn.small.round { width: 52px; padding: 0; }
  .btn.yellow { --c: var(--yellow); --d: var(--yellow-d); }
  .btn.blue { --c: var(--blue); --d: var(--blue-d); }
  .btn.red { --c: var(--red); --d: var(--red-d); }
  .btn.purple { --c: var(--purple); --d: var(--purple-d); }
  .btn.grey { --c: var(--grey); --d: var(--grey-d); }
  .btn.white { --c: #ffffff; --d: #c8d0e4; color: var(--ink); text-shadow: none; }
  .btn.go { animation: pulse 1.3s ease-in-out infinite; }
  .btn.off { filter: grayscale(.9) brightness(.85); }
  .btn.off::before { content: ''; position: absolute; left: 14%; right: 14%; top: 50%; height: 5px; margin-top: -2px; background: var(--red); border-radius: 3px; transform: rotate(-38deg); box-shadow: 0 0 0 2px var(--ink); z-index: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 18px 0 8px; border-radius: 26px; background: rgba(15,18,48,.62); border: 3px solid rgba(255,255,255,.18);
    font-family: var(--display); font-size: 28px; color: #fff; white-space: nowrap; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .coin-ic { width: 36px; height: 36px; color: #ffcf33; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
  .row { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .panel { --c: var(--blue); position: relative; background: linear-gradient(180deg, #ffffff, #eef2fb); color: var(--ink); border-radius: 30px; border: 4px solid var(--ink);
    box-shadow: 0 0 0 6px var(--c), 0 0 0 10px var(--ink), 0 18px 40px rgba(0,0,0,.45); padding: 24px 26px 26px; text-align: center; animation: pop .4s ease-out; }
  .ribbon { position: relative; display: inline-block; font-family: var(--display); font-size: clamp(30px, 8vw, 46px); line-height: 1; color: #fff; padding: 12px 30px 14px; margin-top: -54px; margin-bottom: 8px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); border: 4px solid var(--ink); border-radius: 18px; text-shadow: 0 3px 0 rgba(0,0,0,.3); box-shadow: 0 6px 0 var(--ink); white-space: nowrap; }
  .dim-bg { background: radial-gradient(ellipse at center, rgba(10,12,40,.2), rgba(10,12,40,.62)); }

  /* loading */
  #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
    background: radial-gradient(ellipse at 50% 35%, #3a4bb8 0%, #1f2563 55%, #12153b 100%); }
  #load-bar { --k: 0; width: min(420px, 74vw); height: 30px; border-radius: 18px; border: 4px solid var(--ink); background: #0d1030; overflow: hidden; box-shadow: 0 6px 0 var(--ink); }
  #load-bar i { display: block; height: 100%; width: calc(var(--k) * 100%); border-radius: 12px; transition: width .25s;
    background: repeating-linear-gradient(-45deg, #ffd23f 0 14px, #ffbe1a 14px 28px); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.5); }
  #loading .fail { display: none; font-size: 24px; text-align: center; line-height: 1.4; max-width: 80vw; }
  #loading.failed .fail { display: block; }
  #loading.failed #load-bar { display: none; }

  /* logo */
  .logo { margin: 0; text-align: center; line-height: .82; transform: rotate(-4deg); animation: bob 2.6s ease-in-out infinite; }
  .logo b, .logo span { display: block; font-family: var(--display); font-weight: 400; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; }
  .logo b { font-size: clamp(66px, 17vw, 132px); color: #ffd23f; text-shadow: 0 7px 0 #ff7a1a, 0 13px 0 var(--ink), 0 22px 30px rgba(0,0,0,.45); letter-spacing: 3px; }
  .logo span { font-size: clamp(74px, 19vw, 150px); color: #6ff0ff; text-shadow: 0 7px 0 #1f8fd6, 0 13px 0 var(--ink), 0 22px 30px rgba(0,0,0,.45); letter-spacing: 6px; margin-top: 6px; }

  /* title */
  #s-title { justify-content: space-between; padding-top: max(6vh, var(--pad)); padding-bottom: max(7vh, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(10,14,50,.25), transparent 30%, transparent 70%, rgba(10,14,50,.35)); }
  .t-bottom { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .t-row { display: flex; align-items: center; gap: 18px; }
  #b-credits { position: fixed; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); }
  .shop-btn { flex-direction: column; gap: 0; width: 96px; height: 96px; padding: 0; font-size: 50px; border-radius: 26px; overflow: visible; }
  .shop-btn::after { display: none; }
  .coin-tag { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); border: 3px solid var(--ink); display: inline-flex; align-items: center; gap: 4px; font-size: 20px; background: var(--ink); color: #ffd23f; border-radius: 14px; padding: 3px 9px 3px 5px; text-shadow: none; }
  .coin-tag .ic { width: 22px; height: 22px; color: #ffcf33; filter: none; }

  /* map */
  #s-map { justify-content: flex-start; padding: 0; background: linear-gradient(180deg, rgba(20,26,84,.86), rgba(20,26,84,.5) 38%, rgba(12,44,70,.82)); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .m-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: var(--pad) 12px 10px; }
  .m-head .row { gap: 8px; flex-wrap: nowrap; }
  #map-list { flex: 1; width: 100%; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 6px 0 70px; }
  .m-level { display: flex; flex-direction: column; align-items: center; }
  .m-banner { --c: var(--purple); margin: 14px 0 0; font-family: var(--display); font-size: clamp(30px, 8vw, 44px); color: #fff; padding: 8px 28px 10px; border-radius: 18px; border: 4px solid var(--ink);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); box-shadow: 0 6px 0 var(--ink); text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .m-topic { margin: 10px 0 4px; font-size: 18px; font-weight: 600; opacity: .85; }
  .m-path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 34px 0 24px; }
  .m-path::before { content: ''; position: absolute; top: 50px; bottom: 70px; left: 50%; width: 14px; margin-left: -7px; border-radius: 8px;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.75) 0 16px, rgba(255,255,255,.15) 16px 30px); }
  .stop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; transform: translateX(calc(var(--off) * min(22vw, 130px))); }
  .stop .medal { --c: #888; position: relative; width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; font-size: 62px; color: #fff;
    background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--c) 45%, #fff) 0%, var(--c) 58%, color-mix(in srgb, var(--c) 70%, #000) 100%);
    border: 5px solid #fff; box-shadow: 0 0 0 4px var(--ink), 0 9px 0 var(--ink), 0 14px 22px rgba(0,0,0,.4); }
  .stop .medal .ic { filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
  .stop.final .medal { width: 132px; height: 132px; font-size: 76px; border-color: #ffd23f; }
  .stop .s-name { font-family: var(--display); font-size: 22px; line-height: 1.05; max-width: 46vw; text-align: center; background: var(--ink); padding: 5px 12px 6px; border-radius: 12px; margin-top: 6px; }
  .stars { display: flex; gap: 2px; }
  .stars .ic { width: 30px; height: 30px; color: rgba(255,255,255,.22); filter: drop-shadow(0 2px 0 rgba(0,0,0,.5)); }
  .stars .ic.on { color: #ffd23f; }
  .stop.locked .medal { --c: #7d869c !important; font-size: 46px; }
  .stop.locked .s-name { opacity: .75; }
  .stop.next .medal { animation: pulse 1.1s ease-in-out infinite; box-shadow: 0 0 0 4px var(--ink), 0 9px 0 var(--ink), 0 0 0 14px rgba(255,210,63,.55), 0 14px 22px rgba(0,0,0,.4); }
  .stop.next::after { content: ''; position: absolute; top: -26px; left: 50%; margin-left: -14px; border: 14px solid transparent; border-top: 18px solid #ffd23f; filter: drop-shadow(0 3px 0 var(--ink)); animation: bob .8s ease-in-out infinite; }
  .stop.nope { animation: shake .4s; }

  /* intro */
  #s-intro { justify-content: space-between; padding-top: max(5vh, var(--pad)); padding-bottom: max(5vh, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(10,14,50,.45), transparent 32%, transparent 68%, rgba(10,14,50,.45)); }
  .i-top { display: flex; flex-direction: column; align-items: center; gap: 4px; animation: drop .5s cubic-bezier(.3,1.4,.6,1); }
  #i-name { margin: 0; font-size: clamp(46px, 12vw, 92px); line-height: 1; text-align: center; }
  .i-chaser { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-size: clamp(24px, 6vw, 34px); padding: 6px 20px 8px 10px; border-radius: 30px; background: rgba(15,18,48,.7); border: 3px solid rgba(255,255,255,.2); }
  .i-chaser .badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; background: var(--c, #c0392b); border: 3px solid #fff; }
  .i-bottom { display: flex; align-items: center; gap: 18px; animation: rise .5s cubic-bezier(.3,1.4,.6,1); }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hud-top { position: absolute; top: var(--pad); left: 10px; right: 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  #hearts { display: flex; gap: 2px; padding: 6px 10px; border-radius: 26px; background: rgba(15,18,48,.5); }
  #hearts .ic { width: clamp(26px, 6.4vw, 36px); height: clamp(26px, 6.4vw, 36px); color: #ff3b5c; filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); transition: transform .2s; }
  #hearts .ic.gone { color: rgba(255,255,255,.25); transform: scale(.85); }
  #hearts.hurt { animation: shake .4s; }
  #coins { pointer-events: none; }
  #coins.bump { animation: pop .25s; }
  .hud-right { display: flex; gap: 8px; align-items: center; }
  #b-pause { pointer-events: auto; }
  #chase { position: absolute; top: calc(var(--pad) + 66px); left: 0; right: 0; margin: 0 auto; width: min(320px, 60vw); height: 40px; border-radius: 22px; background: rgba(15,18,48,.55); --k: 0; }
  #chase::before { content: ''; position: absolute; inset: 16px 44px 16px 18px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,255,255,.2), #ff3b3b); opacity: calc(.35 + var(--k) * .65); }
  #chase .c-ic { position: absolute; top: 50%; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; transform: translate(-50%, -50%); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--ink); }
  #chase .c-hero { left: calc(100% - 22px); background: var(--blue); }
  #chase .c-mon { left: calc(20px + var(--k) * (100% - 72px)); background: #c0392b; transition: left .15s linear; }
  #chase.danger { animation: shake .5s infinite; }
  #chase.danger .c-mon { background: var(--red); }
  #dots { position: absolute; top: calc(var(--pad) + 112px); left: 50%; transform: translateX(-50%); display: flex; gap: 3px; padding: 3px 8px; border-radius: 16px; background: rgba(15,18,48,.45); }
  #dots .ic { width: 26px; height: 26px; color: rgba(255,255,255,.35); filter: drop-shadow(0 2px 0 rgba(0,0,0,.5)); }
  #dots .ic.on { color: #ffd23f; animation: pop .35s; }
  #toast { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(.5); opacity: 0; font-size: clamp(40px, 11vw, 80px); white-space: nowrap;
    transition: transform .25s cubic-bezier(.3,1.6,.6,1), opacity .25s; color: var(--c, #fff); }
  #toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  #hint { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 20px; border-radius: 26px; background: rgba(15,18,48,.55); }
  #hint .hand { font-size: 46px; animation: swipe 1.2s ease-in-out infinite; }
  #hint .hand.down { animation: swipeDown .9s ease-in-out infinite; }
  #hint .arrows { display: flex; gap: 14px; font-size: 38px; color: #ffd23f; }
  @keyframes swipe { 0%, 100% { transform: translateX(-34px); } 50% { transform: translateX(34px); } }
  @keyframes swipeDown { 0%, 100% { transform: translateY(-14px); } 50% { transform: translateY(16px); } }

  /* power-ups that are on, with a ring that runs down */
  #powers { position: absolute; top: calc(var(--pad) + 62px); left: 10px; display: flex; flex-direction: column; gap: 8px; }
  #powers .pw { --p: 1; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; color: var(--c); animation: pop .35s;
    background: radial-gradient(circle, #fff 0 55%, transparent 56%), conic-gradient(var(--c) calc(var(--p) * 360deg), rgba(255,255,255,.25) 0); box-shadow: 0 0 14px var(--c), 0 0 0 3px var(--ink); }
  #powers .pw.ending { animation: blink .3s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* question */
  #s-q { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: var(--pad) 12px max(14px, env(safe-area-inset-bottom)); pointer-events: none; }
  #s-q > * { pointer-events: auto; }
  #q-card { --c: var(--blue); position: relative; width: min(760px, 100%); display: flex; align-items: center; gap: 14px; padding: 12px 16px 14px 12px; color: var(--ink); text-align: left;
    background: linear-gradient(180deg, #ffffff, #eef2fb); border-radius: 26px; border: 4px solid var(--ink); box-shadow: 0 0 0 5px var(--c), 0 0 0 9px var(--ink), 0 12px 24px rgba(0,0,0,.35); }
  #s-q.in #q-card { animation: drop .45s cubic-bezier(.3,1.5,.6,1); }
  #s-q.in #answers { animation: rise .45s cubic-bezier(.3,1.5,.6,1); }
  #b-speak { font-size: 34px; }
  #b-speak.talking { animation: pulse .6s ease-in-out infinite; --c: #6fe6ff; --d: #1d9cc0; }
  .q-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  #q-show { font-family: var(--display); font-size: clamp(22px, 5.4vw, 32px); line-height: 1.1; color: color-mix(in srgb, var(--c) 75%, #000); }
  #q-text { font-weight: 700; font-size: clamp(23px, 5.8vw, 36px); line-height: 1.12; }
  #q-pic { width: 70px; height: 70px; flex: none; border-radius: 20px; display: grid; place-items: center; font-size: 46px; color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 65%, #fff), var(--c)); border: 3px solid var(--ink); }
  #q-power { position: absolute; top: -22px; right: -14px; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; color: var(--pc);
    background: radial-gradient(circle at 35% 30%, #fff, #f2f4ff 70%); border: 4px solid var(--ink); box-shadow: 0 0 0 5px var(--pc), 0 0 26px var(--pc); animation: pulse .9s ease-in-out infinite; }
  #s-q.power #q-card { padding-right: 70px; margin-top: 18px; }
  #answers { width: min(760px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ans { --c: var(--blue); --d: var(--blue-d); min-height: clamp(76px, 14vh, 112px); font-family: var(--body); font-weight: 700; font-size: clamp(21px, 5.2vw, 32px); line-height: 1.05; padding: 8px 12px; letter-spacing: 0; transition: opacity .2s, transform .2s, filter .2s; }
  .ans:nth-child(1) { --c: #2f8cff; --d: #1557b8; } .ans:nth-child(2) { --c: #a052ff; --d: #6a2bc4; } .ans:nth-child(3) { --c: #ff8a1f; --d: #c45a00; } .ans:nth-child(4) { --c: #14b8a6; --d: #0b7d71; }
  .ans.reading { box-shadow: inset 0 -6px 0 var(--d), inset 0 3px 0 rgba(255,255,255,.45), 0 6px 0 var(--ink), 0 0 0 6px #ffd23f; }
  .ans.dim { opacity: .35; filter: saturate(.5); }
  .ans.right { --c: #2fd24f; --d: #15912c; opacity: 1; transform: scale(1.05); animation: pop .35s; box-shadow: inset 0 -6px 0 var(--d), 0 6px 0 var(--ink), 0 0 0 6px #fff, 0 0 30px #7dff8a; }
  .ans.wrong { --c: #ff4b4b; --d: #b8232a; animation: shake .45s; }
  #tip { position: fixed; left: 0; right: 0; margin: 0 auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 2 * clamp(76px, 14vh, 112px) + 46px); width: min(600px, 94vw);
    display: flex; align-items: center; gap: 12px; color: var(--ink); background: linear-gradient(180deg, #fff, #fff1f1); border-radius: 24px; border: 4px solid var(--ink); padding: 10px 10px 10px 12px;
    box-shadow: 0 0 0 5px var(--red), 0 0 0 9px var(--ink), 0 10px 24px rgba(0,0,0,.35); animation: pop .35s; }
  #tip-text { flex: 1; font-weight: 700; font-size: clamp(22px, 5.4vw, 30px); line-height: 1.1; }
  #b-next { font-size: 40px; width: 92px; }
  body[data-mode="question"] #chase, body[data-mode="question"] #dots, body[data-mode="feedback"] #chase, body[data-mode="feedback"] #dots { visibility: hidden; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  #flash.red { background: radial-gradient(circle, rgba(255,0,0,0) 30%, rgba(255,0,0,.55)); animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

  /* result cards */
  .result { min-width: min(380px, 90vw); max-width: 92vw; padding-top: 34px; }
  .result .big-ic { font-size: 108px; line-height: 1; margin: 4px 0 6px; color: var(--c); filter: drop-shadow(0 6px 0 rgba(0,0,0,.18)); }
  .result .row { margin-top: 18px; }
  .stars-big { display: flex; justify-content: center; gap: 6px; margin: 2px 0 8px; }

  .stars-big .ic:nth-child(2) { transform: translateY(-14px); }
  .stars-big .ic.on { color: #ffc61a; animation: pop .5s ease-out; }
  .coin-line { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 44px; color: #c98a00; }
  .coin-line .ic { width: 46px; height: 46px; color: #ffbf1a; }

  .unlock .ic { width: 34px; height: 34px; }

  /* shop */
  #s-shop { padding: 0; justify-content: space-between; align-items: stretch; }
  .sh-top { display: flex; align-items: center; justify-content: space-between; padding: var(--pad) 12px 0; }
  .pill.bump { animation: pop .3s; }
  .pill.nope { animation: shake .4s; background: rgba(255,59,48,.85); }
  .sh-panel { height: 56vh; display: flex; flex-direction: column; color: var(--ink); background: linear-gradient(180deg, #ffffff, #eaf0fb); border-top: 4px solid var(--ink);
    border-radius: 30px 30px 0 0; padding: 0 12px max(12px, env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,.35); animation: rise .35s cubic-bezier(.3,1.3,.6,1); }
  .sh-tabs { display: flex; justify-content: center; gap: 10px; margin-top: -40px; }
  .sh-tab { font-size: 36px; width: 74px; height: 74px; }
  .sh-tab.on { --c: var(--yellow); --d: var(--yellow-d); transform: translateY(-6px); }
  .sh-grid { flex: 1; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; padding: 18px 10px 16px; align-content: start; }
  .sh-card { --ic: #ffd23f; position: relative; border-radius: 22px; background: #fff; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink);
    border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
  .sh-card .thumb { width: 84px; height: 84px; border-radius: 16px; display: grid; place-items: center; font-size: 52px; color: #fff; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--ic) 55%, #fff), var(--ic)); }
  .sh-card .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .sh-card .thumb .ic { filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
  .sh-card .n { font-family: var(--display); font-size: 18px; line-height: 1.05; }
  .price { display: inline-flex; align-items: center; gap: 3px; font-family: var(--display); font-size: 18px; background: #ffd23f; border-radius: 20px; padding: 1px 10px 1px 4px; white-space: nowrap; border: 2px solid var(--ink); }
  .price .ic { width: 20px; height: 20px; color: #e8a400; }
  .price.poor { background: #e4e7ee; color: #8a93a6; }
  .sh-card.locked .thumb { filter: saturate(.8); }
  .sh-card.sel { box-shadow: 0 5px 0 var(--ink), 0 0 0 5px var(--blue); transform: scale(1.04); }
  .sh-card .eq { position: absolute; top: -10px; right: -8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; color: #fff; background: var(--green); border: 3px solid var(--ink); }
  .sh-card.got { animation: pop .45s; }
  .sh-card .pips { display: flex; gap: 4px; margin: 2px 0; }
  .sh-card .pips i { width: 14px; height: 14px; border-radius: 50%; background: #d3d9e6; border: 2px solid var(--ink); }
  .sh-card .pips i.on { background: var(--ic); }
  .sh-card .tm { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-size: 18px; color: #4a5372; }
  .sh-card .tm .ic { width: 20px; height: 20px; }
  .sh-bottom { display: flex; align-items: center; gap: 12px; padding-top: 10px; border-top: 3px dashed #d6deee; }
  .sh-info { flex: 1; font-family: var(--display); font-size: clamp(24px, 6vw, 34px); line-height: 1.05; }
  .sh-act { min-width: 170px; }
  .sh-act.done { --c: var(--grey); --d: var(--grey-d); animation: none; }
  .sh-act.poor { --c: var(--grey); --d: var(--grey-d); animation: none; }
  .sh-act.use { --c: var(--blue); --d: var(--blue-d); }
  .sh-act.nope { animation: shake .4s; }
  @media (min-aspect-ratio: 4/5) {
    #s-shop { flex-direction: row; align-items: flex-start; }
    .sh-panel { position: fixed; top: 0; right: 0; bottom: 0; height: auto; width: min(48vw, 600px); border-top: 0; border-left: 4px solid var(--ink); border-radius: 30px 0 0 30px; padding: max(12px, var(--pad)) 14px max(12px, env(safe-area-inset-bottom)); animation: slideIn .35s cubic-bezier(.3,1.3,.6,1); }
    .sh-tabs { margin-top: 0; }
    .sh-tab.on { transform: translateY(-3px); }
  }

  /* credits */
  #s-credits { background: rgba(10,12,40,.7); }
  #s-credits .panel { width: min(640px, 94vw); max-height: 84vh; display: flex; flex-direction: column; text-align: left; padding: 30px 20px 18px; }
  #s-credits .ribbon { align-self: center; }
  #credits-text { overflow-y: auto; touch-action: pan-y; font-size: 16px; line-height: 1.45; padding: 0 6px; user-select: text; -webkit-user-select: text; }
  #credits-text h4 { margin: 14px 0 4px; font-family: var(--display); font-weight: 400; font-size: 22px; }
  #credits-text p { margin: 0 0 6px; }
  #credits-text a { color: var(--blue-d); }
  #s-credits .row { margin-top: 12px; }

  @media (max-height: 540px) {
    .btn.big { font-size: 32px; min-height: 66px; }
    .result .big-ic { font-size: 70px; }
    .stars-big .ic { width: 60px; height: 60px; }
    #chase { top: calc(var(--pad) + 4px); width: min(260px, 36vw); }

  @media (min-width: 700px) and (min-height: 900px) {
    .btn.big { font-size: 50px; min-height: 104px; padding: 0 52px; border-radius: 32px; }

    .sh-card .thumb { width: 112px; height: 112px; }
    .sh-card .n { font-size: 21px; }
  }
</style>

<body data-mode="title">
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="hud-top">
    <div id="hearts"></div>
    <div class="hud-right">
      <div id="coins" class="pill"><svg class="ic coin-ic"><use href="#i-coin"/></svg><span id="coin-n">0</span></div>
      <button id="b-pause" class="btn white small square" aria-label="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
    </div>
  </div>
  <div id="chase" aria-hidden="true"><span class="c-ic c-mon" id="c-mon"></span><span class="c-ic c-hero"><svg class="ic"><use href="#i-runner"/></svg></span></div>
  <div id="dots"></div>
  <div id="powers"></div>
  <div id="toast" class="shout"></div>
  <div id="hint" hidden></div>
</div>

<section id="s-title" class="screen">
  <h1 class="logo"><b>CRITTER</b><span>RUN</span></h1>
  <div class="t-bottom">
    <div class="t-row">
      <button id="b-t-shop" class="btn yellow shop-btn" aria-label="Shop"><svg class="ic"><use href="#i-shop"/></svg><span class="coin-tag"><svg class="ic"><use href="#i-coin"/></svg><span id="t-coins">0</span></span></button>
      <button id="b-play" class="btn big go shiny" aria-label="Play"><svg class="ic"><use href="#i-play"/></svg>PLAY</button>
    </div>
  </div>
  <button id="b-credits" class="btn white small round" aria-label="Credits"><svg class="ic"><use href="#i-info"/></svg></button>
</section>

<section id="s-map" class="screen" hidden>
  <div class="m-head">
    <button id="b-m-home" class="btn white small square" aria-label="Home"><svg class="ic"><use href="#i-home"/></svg></button>
    <button id="b-m-shop" class="pill" aria-label="Shop"><svg class="ic coin-ic"><use href="#i-coin"/></svg><span id="m-coins">0</span><svg class="ic" style="width:30px;height:30px;color:#ffd23f;margin-left:4px"><use href="#i-shop"/></svg></button>
    <div class="row">
      <button class="btn blue small square" data-toggle="music" aria-label="Music"><svg class="ic"><use href="#i-music"/></svg></button>
      <button class="btn blue small square" data-toggle="sfx" aria-label="Sounds"><svg class="ic"><use href="#i-sound"/></svg></button>
      <button class="btn blue small square" data-toggle="autoRead" aria-label="Read questions out loud"><svg class="ic"><use href="#i-read"/></svg></button>
    </div>
  </div>
  <div id="map-list"></div>
</section>

<section id="s-intro" class="screen" hidden>
  <div class="i-top">
    <h2 id="i-name" class="shout"></h2>
    <div class="i-chaser"><span class="badge" id="i-badge"></span><span id="i-chaser"></span></div>
  </div>
  <div class="i-bottom">
    <button id="b-i-back" class="btn white square" aria-label="Map"><svg class="ic"><use href="#i-map"/></svg></button>
    <button id="b-go" class="btn big go shiny" aria-label="Go"><svg class="ic"><use href="#i-play"/></svg>GO!</button>
  </div>
</section>

<section id="s-q" hidden>
  <div id="q-card">
    <div id="q-power" hidden></div>
    <div id="q-pic" hidden></div>
    <div class="q-body">
      <div id="q-show"></div>
      <div id="q-text"></div>
    </div>
    <button id="b-speak" class="btn yellow square" aria-label="Read it to me"><svg class="ic"><use href="#i-sound"/></svg></button>
  </div>
  <div id="tip" hidden>
    <button id="b-tip-speak" class="btn yellow small square" aria-label="Read it to me"><svg class="ic"><use href="#i-sound"/></svg></button>
    <span id="tip-text"></span>
    <button id="b-next" class="btn go" aria-label="Keep running"><svg class="ic"><use href="#i-next"/></svg></button>
  </div>
  <div id="answers"></div>
</section>

<section id="s-shop" class="screen" hidden>
  <div class="sh-top">
    <button id="b-sh-back" class="btn white small square" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>
    <div class="pill"><svg class="ic coin-ic"><use href="#i-coin"/></svg><span id="sh-coins">0</span></div>
  </div>
  <div class="sh-panel">
    <div class="sh-tabs" id="sh-tabs"></div>
    <div class="sh-grid" id="sh-grid"></div>
    <div class="sh-bottom">
      <div class="sh-info" id="sh-info"></div>
      <button id="b-sh-act" class="btn sh-act"></button>
    </div>
  </div>
</section>

<section id="s-caught" class="screen dim-bg" hidden>
  <div class="panel result" style="--c:var(--red)">
    <div class="ribbon">CAUGHT!</div>
    <div class="big-ic" id="k-ic"></div>
    <div class="coin-line"><svg class="ic"><use href="#i-coin"/></svg><span id="k-coins">+0</span></div>
    <div class="row">
      <button id="b-k-map" class="btn white square" aria-label="Map"><svg class="ic"><use href="#i-map"/></svg></button>
      <button id="b-k-retry" class="btn big go" aria-label="Try again"><svg class="ic"><use href="#i-retry"/></svg>AGAIN</button>
    </div>
  </div>
</section>

<section id="s-clear" class="screen dim-bg" hidden>
  <div class="panel result" style="--c:var(--yellow)">
    <div class="ribbon" id="w-title">YOU MADE IT!</div>
    <div class="stars-big" id="w-stars"></div>
    <div class="coin-line"><svg class="ic"><use href="#i-coin"/></svg><span id="w-coins">+0</span></div>
    <div><span class="unlock" id="w-unlock" hidden></span></div>
    <div class="row">
      <button id="b-w-map" class="btn white square" aria-label="Map"><svg class="ic"><use href="#i-map"/></svg></button>
      <button id="b-w-retry" class="btn blue square" aria-label="Play again"><svg class="ic"><use href="#i-retry"/></svg></button>
      <button id="b-w-next" class="btn big go shiny" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg>NEXT</button>
    </div>
  </div>
</section>

<section id="s-pause" class="screen dim-bg" hidden>
  <div class="panel result" style="--c:var(--blue)">
    <div class="ribbon">PAUSED</div>
    <div class="row" style="margin-top:6px">
      <button class="btn blue square" data-toggle="music" aria-label="Music"><svg class="ic"><use href="#i-music"/></svg></button>
      <button class="btn blue square" data-toggle="sfx" aria-label="Sounds"><svg class="ic"><use href="#i-sound"/></svg></button>
      <button class="btn blue square" data-toggle="autoRead" aria-label="Read questions out loud"><svg class="ic"><use href="#i-read"/></svg></button>
    </div>
    <div class="row">
      <button id="b-p-map" class="btn white square" aria-label="Map"><svg class="ic"><use href="#i-map"/></svg></button>
      <button id="b-resume" class="btn big go" aria-label="Keep playing"><svg class="ic"><use href="#i-play"/></svg>GO</button>
    </div>
  </div>
</section>

<section id="s-credits" class="screen" hidden>
  <div class="panel" style="--c:var(--purple)">
    <div class="ribbon">CREDITS</div>
    <div id="credits-text"></div>
    <div class="row"><button id="b-credits-close" class="btn go" aria-label="Close"><svg class="ic"><use href="#i-check"/></svg>OK</button></div>
  </div>
</section>

<div id="flash"></div>
<div id="loading">
  <h1 class="logo"><b>CRITTER</b><span>RUN</span></h1>
  <div id="load-bar"><i></i></div>
  <div class="fail">Something went wrong loading the game.<br>Check the internet connection and reload.</div>
</div>

<script>window.CritterRun = { levels: [], addLevel(level) { this.levels.push(level); } };</script>
<!-- Levels: one file per test, oldest first. -->
<script src="levels/2026-11-sc-landforms.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
