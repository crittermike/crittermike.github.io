<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Critter Run</title>
<meta name="theme-color" content="#16204a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffc61a' stroke='%233a1d00' stroke-width='4'/%3E%3Cpath d='M22 44 30 20h6l-4 10h10L28 50l4-10h-10z' fill='%233a1d00'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Fonts: Fredoka and Lilita One, SIL Open Font License (see assets/CREDITS.md). */
  @font-face { font-family: Fredoka; src: url(assets/fonts/fredoka-latin-500-normal.woff2) format('woff2'); font-weight: 500; font-display: block; }
  @font-face { font-family: Fredoka; src: url(assets/fonts/fredoka-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: block; }
  @font-face { font-family: Fredoka; src: url(assets/fonts/fredoka-latin-700-normal.woff2) format('woff2'); font-weight: 700; font-display: block; }
  @font-face { font-family: 'Lilita One'; src: url(assets/fonts/lilita-one-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: block; }

  :root {
    --ui: Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --display: "Lilita One", Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif;
    --ink: #1b2140;
    --pad: max(12px, env(safe-area-inset-top));
    --padb: max(14px, env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16204a; }
  body { font-family: var(--ui); font-weight: 600; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  [hidden] { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: 0; padding: 0; color: inherit; background: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--pad) 16px var(--padb); }

  /* icons */
  .ico { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em; fill: currentColor; flex: none; overflow: visible; }
  .ico:not(.art) { stroke: rgba(12, 18, 48, .3); stroke-width: var(--sw); paint-order: stroke fill; stroke-linejoin: round; }
  .ico.flat { stroke: none; }

  /* chunky glossy buttons */
  .btn { --b1: #5be37a; --b2: #1fae4a; --lip: #13803a; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .3em;
    font-family: var(--display); font-weight: 400; letter-spacing: .5px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.28);
    border-radius: 24px; background: linear-gradient(180deg, var(--b1), var(--b2));
    box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -5px 0 rgba(0,0,0,.14), 0 6px 0 var(--lip), 0 11px 18px rgba(0,0,0,.28);
    transition: transform .08s, box-shadow .08s, filter .2s; }
  .btn::before { content: ''; position: absolute; left: 12%; right: 12%; top: 5%; height: 36%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); pointer-events: none; }
  .btn > * { position: relative; }
  .btn .ico { filter: drop-shadow(0 2px 0 rgba(0,0,0,.2)); }
  .btn:active { transform: translateY(4px); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -5px 0 rgba(0,0,0,.14), 0 2px 0 var(--lip), 0 4px 8px rgba(0,0,0,.25); }
  .btn.green { --b1: #66ea85; --b2: #1fae4a; --lip: #13803a; }
  .btn.blue { --b1: #62bdff; --b2: #1f77e0; --lip: #1554a6; }
  .btn.gold { --b1: #ffe878; --b2: #ffb51f; --lip: #c27a00; color: #5c3200; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .btn.red { --b1: #ff8080; --b2: #e23b3b; --lip: #a3222a; }
  .btn.purple { --b1: #bb8cff; --b2: #7a45e0; --lip: #5329a8; }
  .btn.orange { --b1: #ffbd5c; --b2: #f2780f; --lip: #b45304; }
  .btn.teal { --b1: #5ff0de; --b2: #10a99c; --lip: #0a7a70; }
  .btn.white { --b1: #ffffff; --b2: #e6ecf7; --lip: #b3bed5; color: var(--ink); text-shadow: none; }
  .btn.white .ico:not(.art) { stroke: none; }
  .btn.glass { --b1: rgba(30, 40, 90, .62); --b2: rgba(14, 20, 52, .72); --lip: rgba(0, 0, 0, .3); box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 4px 0 var(--lip), 0 8px 14px rgba(0,0,0,.2); }
  .btn.glass::before { opacity: .35; }
  .btn.round { border-radius: 50%; aspect-ratio: 1; }
  .btn.ringed { border: 5px solid #fff; }
  .btn.xl { width: 132px; height: 132px; font-size: 68px; }
  .btn.lg { width: 96px; height: 96px; font-size: 48px; }
  .btn.md { width: 72px; height: 72px; font-size: 36px; border-radius: 22px; }
  .btn.sm { width: 56px; height: 56px; font-size: 28px; border-radius: 18px; }
  .btn.round.md, .btn.round.sm { border-radius: 50%; }
  .btn.xl .ico-play, .btn.lg .ico-play { margin-left: .1em; }
  .btn.off { filter: grayscale(.9) brightness(.85); }
  .btn.off::after { content: ''; position: absolute; left: 18%; right: 18%; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: #ff4b4b; box-shadow: 0 0 0 2px #fff; transform: rotate(-40deg); }
  .pulse { animation: pulse 1.3s ease-in-out infinite; }
  .btn.busy { filter: saturate(.55); animation: none; }
  .btn.busy::after { content: ''; position: absolute; inset: -12px; border-radius: 50%; border: 7px solid rgba(255,255,255,.9); border-top-color: transparent; border-right-color: transparent; animation: spin .7s linear infinite; }

  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 65% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes popIn { 0% { transform: translateY(30px) scale(.8); opacity: 0; } 70% { transform: translateY(-4px) scale(1.03); opacity: 1; } 100% { transform: none; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-14px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-9px); } 80% { transform: translateX(6px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(-3deg); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes shine { 0%, 70% { transform: translateX(-120%) skewX(-20deg); } 100% { transform: translateX(220%) skewX(-20deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* cream panels with a colored ribbon on top */
  .panel { --c: #ff4081; position: relative; background: linear-gradient(180deg, #fffdf7, #fff1d6); color: var(--ink); border-radius: 32px; border: 5px solid #fff;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 70%, #000), 0 14px 0 rgba(0,0,0,.2), 0 26px 50px rgba(0,0,0,.4); padding: 46px 26px 26px; text-align: center; animation: popIn .45s cubic-bezier(.3,1.4,.6,1); }
  .ribbon { position: absolute; left: 50%; top: 0; transform: translate(-50%, -55%); white-space: nowrap; font-family: var(--display); font-size: clamp(30px, 8vw, 46px); line-height: 1; color: #fff;
    padding: 14px 34px 16px; border-radius: 20px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 80%, #000));
    border: 4px solid #fff; box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 60%, #000), 0 10px 20px rgba(0,0,0,.25); text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .panel .row { display: flex; gap: 18px; align-items: center; justify-content: center; margin-top: 22px; }
  .dim-bg { background: radial-gradient(circle at 50% 40%, rgba(10,16,48,.25), rgba(10,16,48,.7)); }

  /* ---------- loading ---------- */
  #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
    background: radial-gradient(circle at 50% 35%, #3b4fb0, #1a2361 55%, #0d1336); transition: opacity .5s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .logo { width: min(520px, 80vw); animation: bob 2.4s ease-in-out infinite; }
  .load-bar { width: min(380px, 70vw); height: 26px; border-radius: 20px; background: rgba(0,0,0,.35); border: 4px solid rgba(255,255,255,.85); overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .load-bar i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); border-radius: 12px; background: linear-gradient(180deg, #ffe878, #ffb51f); box-shadow: inset 0 3px 0 rgba(255,255,255,.5); transition: width .25s; }
  #loading .runner { font-size: 54px; color: #fff; animation: float .45s ease-in-out infinite; }
  .nogl { font-size: 26px; text-align: center; line-height: 1.4; max-width: 80vw; }

  /* ---------- title ---------- */
  .logo { display: block; width: min(600px, 86vw); height: auto; overflow: visible; filter: drop-shadow(0 12px 18px rgba(0,0,0,.35)); }
  .logo text { font-family: var(--display); }
  #s-title { justify-content: space-between; padding-top: max(5vh, var(--pad)); padding-bottom: max(7vh, var(--padb)); }
  #s-title .logo { animation: bob 2.6s ease-in-out infinite; }
  .t-row { display: flex; align-items: center; gap: 30px; }
  .shop-btn { position: relative; }
  .shop-btn .badge { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 28px; line-height: 1; color: #fff; white-space: nowrap;
    padding: 6px 16px 7px 8px; border-radius: 30px; background: linear-gradient(180deg, rgba(20,28,70,.78), rgba(10,14,40,.86)); border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 4px 0 rgba(0,0,0,.3); text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .pill .ico { font-size: 1.25em; }
  .pill.small { font-size: 20px; padding: 3px 12px 4px 5px; }
  .corner { position: fixed; top: var(--pad); right: 12px; display: flex; gap: 10px; }

  /* ---------- map ---------- */
  #s-map { justify-content: flex-start; padding: 0; background: linear-gradient(180deg, rgba(14,22,66,.86), rgba(14,22,66,.45) 35%, rgba(10,40,60,.72)); }
  .m-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: var(--pad) 12px 8px; }
  .m-head .tools { display: flex; gap: 8px; }
  #map-list { flex: 1; width: 100%; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 10px 0 80px; }
  .m-level { position: relative; width: min(560px, 100%); margin: 0 auto; }
  .m-title { position: relative; display: block; width: fit-content; margin: 14px auto 6px; font-family: var(--display); font-size: clamp(30px, 8vw, 44px); line-height: 1; padding: 12px 34px 14px; color: #fff;
    border-radius: 18px; background: linear-gradient(180deg, #ffd85a, #ff9d1a); border: 4px solid #fff; box-shadow: 0 6px 0 #b85f00, 0 12px 22px rgba(0,0,0,.3); text-shadow: 0 3px 0 rgba(120,50,0,.5); }
  .m-path { position: relative; padding: 52px 0 30px; }
  .m-path svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .stop { --c: #888; position: relative; display: flex; flex-direction: column; align-items: center; width: 160px; margin: 0 auto 6px; transform: translateX(calc(var(--off) * min(24vw, 130px))); }
  .stop .medal { position: relative; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; font-size: 62px; color: #fff;
    background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--c) 45%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000));
    border: 6px solid #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 60%, #000), 0 9px 0 rgba(0,0,0,.3), 0 14px 22px rgba(0,0,0,.35); transition: transform .15s; }
  .stop .medal::before { content: ''; position: absolute; left: 16%; right: 16%; top: 8%; height: 34%; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); }
  .stop:active .medal { transform: scale(.94); }
  .stop.final .medal { width: 134px; height: 134px; font-size: 76px; border-color: #ffd23f; }
  .stop .name { margin-top: 10px; font-family: var(--display); font-size: 23px; line-height: 1.05; text-align: center; max-width: 46vw; padding: 5px 14px 7px; border-radius: 14px;
    background: rgba(10,16,48,.62); text-shadow: 0 2px 0 rgba(0,0,0,.5); }
  .stop .stars { display: flex; gap: 2px; margin-top: 6px; font-size: 30px; }
  .stop.locked .medal { background: radial-gradient(circle at 35% 28%, #c9cfdb, #8b93a7 60%, #5d6478); color: #e9edf5; font-size: 52px; box-shadow: 0 0 0 4px #4a5064, 0 9px 0 rgba(0,0,0,.3); }
  .stop.locked .name { opacity: .75; }
  .stop.next .medal { animation: pulse 1.1s ease-in-out infinite; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 60%, #000), 0 0 0 14px rgba(255,214,63,.55), 0 9px 0 rgba(0,0,0,.3); }
  .stop.next::before { content: ''; position: absolute; top: -34px; left: 50%; width: 0; height: 0; margin-left: -16px; border: 16px solid transparent; border-top: 22px solid #ffd23f;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.3)); animation: float .8s ease-in-out infinite; }
  .stop.nope { animation: shake .4s; }
  /* Phones: the header row has to fit home, coins and three toggles side by side. */
  @media (max-width: 420px) {
    .m-head { gap: 6px; padding-left: 8px; padding-right: 8px; }
    .m-head .tools { gap: 6px; }
    .m-head .btn.sm { width: 44px; height: 44px; font-size: 22px; }
    .m-head .pill { font-size: 20px; gap: 5px; padding: 4px 10px 5px 5px; }
  }

  /* ---------- stage intro ---------- */
  #s-intro { justify-content: flex-start; padding-top: max(7vh, calc(var(--pad) + 30px)); }
  #s-intro .panel { display: flex; align-items: center; gap: 18px; padding: 34px 26px 22px; max-width: 94vw; }
  .foe { flex: none; width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-size: 66px; color: #fff;
    background: radial-gradient(circle at 35% 28%, #ff8a7a, #e0362c 60%, #8f1610); border: 5px solid #fff; box-shadow: 0 0 0 4px #7a1410, 0 7px 0 rgba(0,0,0,.25); }
  .pics { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
  .pic { --c: #2f7fe0; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 42px; color: #fff;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 82%, #000), color-mix(in srgb, var(--c) 62%, #000)); border: 3px solid #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 45%, #000); }
  #s-intro .bottom { position: fixed; bottom: max(30px, var(--padb)); left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 26px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hud-top { position: absolute; top: var(--pad); left: 10px; right: 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  #hearts { display: flex; gap: 2px; font-size: clamp(26px, 6.4vw, 38px); line-height: 1; padding: 6px 10px; border-radius: 30px; background: rgba(10,16,48,.45); border: 3px solid rgba(255,255,255,.6); }
  #hearts .ico-life { animation: pop .3s; }
  #hearts.hurt { animation: shake .4s; }
  #coins.bump { animation: pop .25s; }
  .hud-right { display: flex; gap: 8px; align-items: center; }
  #b-pause { pointer-events: auto; }
  #chase { position: absolute; top: calc(var(--pad) + 66px); left: 0; right: 0; margin: 0 auto; width: min(320px, 64vw); height: 40px; --k: 0; }
  #chase .track { position: absolute; left: 18px; right: 18px; top: 12px; height: 16px; border-radius: 10px; background: rgba(10,16,48,.5); border: 3px solid rgba(255,255,255,.75); overflow: hidden; }
  #chase .track i { position: absolute; inset: 0; width: calc(var(--k) * 100%); background: linear-gradient(90deg, #ffd23f, #ff4a3a); }
  #chase .who { position: absolute; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; display: grid; place-items: center; font-size: 25px; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #chase .hero { left: calc(100% - 18px); background: linear-gradient(180deg, #62bdff, #1f77e0); }
  #chase #c-mon { left: calc(18px + var(--k) * (100% - 54px)); background: linear-gradient(180deg, #ff8080, #d42f2f); transition: left .15s linear; }
  #chase.danger #c-mon { animation: shake .5s infinite; }
  #dots { position: absolute; top: calc(var(--pad) + 112px); left: 50%; transform: translateX(-50%); display: flex; gap: 7px; }
  #dots i { width: 18px; height: 18px; transform: rotate(45deg); border-radius: 4px; background: rgba(10,16,48,.45); border: 3px solid rgba(255,255,255,.75); }
  #dots i.on { background: linear-gradient(135deg, #fff3a0, #ffc61a 55%, #f08c00); box-shadow: 0 0 10px #ffd23f; animation: pop .35s; }
  #toast { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) scale(.5); opacity: 0; display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: clamp(40px, 10vw, 76px);
    white-space: nowrap; color: #fff; -webkit-text-stroke: 3px var(--c, #333); paint-order: stroke fill; text-shadow: 0 6px 0 var(--c, #333), 0 12px 20px rgba(0,0,0,.35); transition: transform .25s cubic-bezier(.3,1.6,.6,1), opacity .25s; }
  #toast .ico { font-size: 1.15em; color: #fff; filter: drop-shadow(0 4px 0 var(--c, #333)); }
  #toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  #hint { position: absolute; bottom: 13%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 24px 14px;
    border-radius: 30px; background: rgba(10,16,48,.5); border: 3px solid rgba(255,255,255,.6); color: #fff; }
  #hint .hand { font-size: 56px; animation: swipe 1.2s ease-in-out infinite; }
  #hint .hand.down { animation: swipeDown .9s ease-in-out infinite; }
  #hint .arrows { display: flex; gap: 16px; font-size: 40px; }
  @keyframes swipe { 0%, 100% { transform: translateX(-34px) rotate(-8deg); } 50% { transform: translateX(34px) rotate(8deg); } }
  @keyframes swipeDown { 0%, 100% { transform: translateY(-14px) rotate(180deg); } 50% { transform: translateY(16px) rotate(180deg); } }

  /* power-ups that are on, each with a ring that runs down */
  #powers { position: absolute; top: calc(var(--pad) + 62px); left: 10px; display: flex; flex-direction: column; gap: 10px; }
  #powers .pw { --p: 1; position: relative; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; color: #fff; animation: pop .35s;
    background: conic-gradient(#fff calc(var(--p) * 360deg), rgba(255,255,255,.18) 0); box-shadow: 0 0 16px var(--c); }
  #powers .pw::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 60%, color-mix(in srgb, var(--c) 70%, #000)); }
  #powers .pw .ico { position: relative; }
  #powers .pw.ending { animation: blink .3s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  /* ---------- question ---------- */
  #s-q { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: var(--pad) 12px var(--padb); pointer-events: none; }
  #s-q > * { pointer-events: auto; }
  #q-card { --c: #ff4081; position: relative; width: min(740px, 100%); display: flex; align-items: center; gap: 14px; padding: 12px 16px 14px 12px; color: var(--ink);
    border-radius: 28px; background: linear-gradient(180deg, #fffdf7, #fff1d6); border: 5px solid #fff; box-shadow: 0 0 0 4px var(--c), 0 9px 0 rgba(0,0,0,.22), 0 16px 30px rgba(0,0,0,.3); }
  #s-q.in #q-card { animation: drop .42s cubic-bezier(.3,1.5,.6,1); }
  #q-power { position: absolute; top: -22px; right: -12px; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; color: #fff;
    background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--pc) 50%, #fff), var(--pc) 60%, color-mix(in srgb, var(--pc) 70%, #000)); border: 5px solid #fff;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 60%, #000), 0 0 26px var(--pc); animation: pulse .9s ease-in-out infinite; }
  #s-q.power #q-card { padding-right: 72px; }
  #b-speak { flex: none; }
  #b-speak.talking { animation: pulse .6s ease-in-out infinite; --b1: #8ff7ff; --b2: #22b5d6; --lip: #127f99; }
  #q-body { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #q-pics { display: flex; gap: 8px; }

  .ans { min-height: clamp(74px, 13.5vh, 108px); padding: 8px 12px 12px; border-radius: 26px; font-family: var(--ui); font-weight: 700; font-size: clamp(21px, 5.2vw, 31px); line-height: 1.06;
    border: 4px solid rgba(255,255,255,.95); transition: opacity .2s, filter .2s, transform .2s; }

  .ans .mark { position: absolute; top: -14px; right: -10px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; border: 4px solid #fff; animation: pop .35s; }
  .ans.reading { outline: 6px solid #ffd23f; outline-offset: 3px; }
  .ans.dim { opacity: .35; filter: saturate(.4); }

  .ans.right .mark { background: #1fae4a; }

  #tip { position: fixed; left: 0; right: 0; margin: 0 auto; bottom: calc(var(--padb) + 2 * clamp(74px, 13.5vh, 108px) + 44px); width: min(580px, 94vw); display: flex; align-items: center; gap: 12px;

  body[data-mode="question"] #chase, body[data-mode="question"] #dots, body[data-mode="feedback"] #chase, body[data-mode="feedback"] #dots { visibility: hidden; }

  /* ---------- shop ---------- */
  #s-shop { padding: 0; justify-content: space-between; align-items: stretch; }

  .sh-panel { height: 57vh; display: flex; flex-direction: column; color: var(--ink); background: linear-gradient(180deg, #fffdf7, #fff1d6); border-radius: 32px 32px 0 0; border: 5px solid #fff; border-bottom: 0;

  .sh-tab:not(.on) { --b1: #ffffff; --b2: #dfe6f3; --lip: #a9b5cd; color: #6a7593; text-shadow: none; }
  .sh-tab:not(.on) .ico:not(.art) { stroke: none; }

  .sh-grid { flex: 1; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 14px; padding: 18px 10px 16px; align-content: start; }
  .sh-card { --ic: #ffd23f; position: relative; border-radius: 24px; background: #fff; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink);

  .sh-card .thumb { width: 92px; height: 92px; border-radius: 20px; display: grid; place-items: center; font-size: 56px; color: #fff; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--ic) 40%, #fff), var(--ic) 75%); }
  .sh-card .thumb img { width: 100%; height: 100%; object-fit: cover; }

  .sh-card.got { animation: pop .45s; }

  .sh-card .pips i { width: 14px; height: 14px; border-radius: 50%; background: #dbe1ec; }

  .sh-card .tm { display: inline-flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 700; color: #555; }
  .sh-bottom { display: flex; align-items: center; gap: 12px; padding-top: 10px; border-top: 3px dashed #e3d6b8; }
  .sh-info { flex: 1; font-family: var(--display); font-size: clamp(24px, 6vw, 32px); line-height: 1.05; color: var(--ink); }
  .sh-act { min-width: 176px; height: 78px; padding: 0 22px; font-size: 34px; border-radius: 26px; }
  .sh-act .ico { font-size: 1.1em; }
  .sh-act.done, .sh-act.poor { --b1: #d8dee9; --b2: #aeb7c7; --lip: #858fa3; animation: none; }
  .sh-act.nope { animation: shake .4s; }
  @media (min-aspect-ratio: 4/5) {

  }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: none; } }

  /* ---------- results ---------- */
  .result { min-width: min(400px, 92vw); max-width: 94vw; }
  .result .big-foe { width: 132px; height: 132px; font-size: 84px; margin: 0 auto; }
  .stars-big { display: flex; justify-content: center; gap: 6px; font-size: 92px; margin-top: 4px; }
  .stars-big .ico { transition: transform .3s; }
  .stars-big .ico:nth-child(2) { transform: translateY(-16px) scale(1.12); }
  .stars-big .ico.on { animation: starIn .5s cubic-bezier(.3,1.6,.6,1); }
  @keyframes starIn { 0% { transform: scale(2.2) rotate(-30deg); opacity: 0; } 100% { opacity: 1; } }
  .coin-line { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; font-family: var(--display); font-size: 46px; color: #c27a00; }
  .coin-line .ico { font-size: 1.1em; }
  .unlock { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; font-size: 44px; color: #1fae4a; }
  .unlock .foe { width: 72px; height: 72px; font-size: 44px; }
  .trophy { font-size: 110px; color: #ffc61a; filter: drop-shadow(0 6px 0 #c27a00); }

  /* ---------- pause and credits ---------- */
  .toggles { display: flex; gap: 14px; justify-content: center; }

  @media (max-height: 520px) {
    .btn.xl { width: 104px; height: 104px; font-size: 54px; }

  }

<canvas id="game"></canvas>

</div>

<section id="s-title" class="screen">

      <text x="300" y="268" font-size="158" fill="#0b2a5c" stroke="#0b2a5c" stroke-width="30" transform="translate(0 12)">RUN</text>
