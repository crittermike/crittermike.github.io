<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121313">
<meta name="robots" content="noindex">
<meta name="description" content="Six three-row family vehicles compared: price, cabin space, energy cost, quality-of-life features and interiors.">
<title>Family Vehicle Comparison</title>
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<a class="skip-link" href="#vehicles">Skip to vehicles</a>
<div class="wrap">
<nav class="toc" aria-label="Sections">
  <a href="#ctl-h">Your numbers</a><a href="#rank">Ranking</a><a href="#vehicles">Vehicles</a><a href="#features">Features</a><a href="#space">Space</a><a href="#cost">Cost</a><a href="#compare">Compare</a><a href="#checklist">Test drive</a>
</nav>

<main>
<section aria-labelledby="ctl-h">
  <div class="section-head"><h2 id="ctl-h">Your numbers</h2><button type="button" class="btn quiet" id="reset">Reset</button></div>
  <form class="controls" id="controls" onsubmit="return false">
    <fieldset>
      <div class="seg">
        <label><input type="radio" name="type" value="all" checked><span>All</span></label>
        <label><input type="radio" name="type" value="van"><span>Minivans</span></label>
        <label><input type="radio" name="type" value="suv"><span>SUVs</span></label>
      </div>
    </fieldset>
    <fieldset>
      <div class="seg">
        <label><input type="radio" name="power" value="all" checked><span>All</span></label>
        <label><input type="radio" name="power" value="gas"><span>Gas</span></label>
        <label><input type="radio" name="power" value="hybrid"><span>Hybrid</span></label>
        <label><input type="radio" name="power" value="ev"><span>EV</span></label>
      </div>
    </fieldset>
    <fieldset class="wide">
      <div class="inputs">
        <div class="field"><label for="miles">Annual miles</label><input id="miles" type="number" inputmode="numeric" min="0" step="500" value="12000"></div>
        <div class="field"><label for="gas">Gas, $/gal</label><input id="gas" type="number" inputmode="decimal" min="0" step="0.01" value="3.25"></div>
        <div class="field"><label for="elec">Electricity, $/kWh</label><input id="elec" type="number" inputmode="decimal" min="0" step="0.01" value="0.15"></div>
        <div class="field"><label for="years">Years</label><input id="years" type="number" inputmode="numeric" min="1" max="20" step="1" value="8"></div>
        <div class="field"><label for="curmpg">Your MPG</label><input id="curmpg" type="number" inputmode="decimal" min="0" step="1"></div>
      </div>
    </fieldset>
  </form>
</section>

<section aria-labelledby="rank-h" id="rank">
  <div class="section-head"><h2 id="rank-h">Ranking</h2></div>
  <div class="rank-grid">
    <form class="weights" id="weights" onsubmit="return false" aria-label="Priority weights"></form>
    <div><ol class="ranking" id="ranking"></ol><p class="legend" id="rank-legend"></p></div>
  </div>
</section>

<section aria-labelledby="veh-h" id="vehicles">
  <div class="section-head"><h2 id="veh-h">Vehicles</h2><div class="view-toggle" role="group" aria-label="View"><button type="button" data-view="cards" aria-pressed="true">Cards</button><button type="button" data-view="table" aria-pressed="false">Table</button></div></div>
  <ul class="cards" id="cards"></ul>
  <div id="big" hidden><div class="big-wrap" tabindex="0" role="region" aria-label="All vehicles and features table" id="big-wrap"></div></div>
</section>

<section aria-labelledby="feat-h" id="features">
  <div class="section-head"><h2 id="feat-h">Features</h2></div>
  <div class="tools">
    <label><input type="checkbox" id="diff-only"> Differences only</label>
    <span class="keyrow" id="feat-key"></span>
  </div>
  <div class="table-wrap" id="matrix-wrap" tabindex="0" role="region" aria-label="Feature matrix"></div>
</section>

<section aria-labelledby="space-h" id="space">
  <div class="section-head"><h2 id="space-h">Space</h2></div>
  <div class="bars" id="space-bars"></div>
</section>

<section aria-labelledby="cost-h" id="cost">
  <div class="section-head"><h2 id="cost-h">Cost</h2></div>
  <div class="bars" id="cost-bars"></div>
</section>

<section aria-labelledby="cmp-h" id="compare">
  <div class="section-head"><h2 id="cmp-h">Compare</h2><button type="button" class="btn quiet" id="clear-cmp">Clear</button></div>
  <div id="compare-out"></div>
</section>

<section aria-labelledby="chk-h" id="checklist">
  <div class="section-head"><h2 id="chk-h">Test-drive checklist</h2><button type="button" class="btn quiet" id="clear-chk">Clear</button></div>
  <ul class="checklist" id="chk"></ul>
</section>

</main>
</div>

<dialog id="lb" aria-label="Photo viewer">
  <img id="lb-img" alt="">
  <div class="lb-bar"><button type="button" class="btn quiet" id="lb-prev" aria-label="Previous photo">&larr;</button><p id="lb-cap"></p><button type="button" class="btn quiet" id="lb-next" aria-label="Next photo">&rarr;</button><button type="button" class="btn quiet" id="lb-close">Close</button></div>
</dialog>
<script src="data.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
