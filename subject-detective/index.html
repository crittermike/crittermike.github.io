<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Subject Quest</title>
<style>
:root{--sky:#5fc9ff;--navy:#183153;--cream:#fffbed;--yellow:#ffd84d;--green:#27ae60;--red:#df4b4b;--purple:#7357d8;--line:#b7c9dc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#5fc9ff 0 38%,#a7e477 38%);color:var(--navy);font-family:"Trebuchet MS",Arial,sans-serif;padding:12px}
main{width:min(760px,100%);margin:auto;background:var(--cream);border:4px solid var(--navy);border-radius:24px;box-shadow:0 8px 0 #183153;padding:clamp(16px,4vw,30px);min-height:min(720px,calc(100vh - 24px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px solid var(--line);padding-bottom:14px}h1{font-size:clamp(1.7rem,6vw,2.8rem);margin:0;letter-spacing:-.04em}.stats{display:flex;gap:8px}.pill{background:white;border:3px solid var(--navy);border-radius:999px;padding:8px 12px;font-size:1rem;font-weight:900;white-space:nowrap}.pill.score{background:var(--yellow)}
.meter{height:13px;background:#dce6ef;border:2px solid var(--navy);border-radius:20px;margin:18px 0;overflow:hidden}.meter span{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.task{text-align:center;margin:22px 0 8px}.step{font-size:.9rem;font-weight:900;text-transform:uppercase;color:var(--purple);letter-spacing:.08em}.prompt{font-size:clamp(1.35rem,5vw,2rem);font-weight:900;margin:5px 0}.prompt strong{color:var(--purple)}
.sentence{background:white;border:3px solid var(--navy);border-radius:16px;padding:18px;margin:20px 0;font-size:clamp(1.25rem,4vw,1.8rem);font-weight:800;line-height:1.35;text-align:center}
.words{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.word{min-height:54px;padding:10px 15px;border:3px solid var(--line);border-radius:12px;background:white;color:var(--navy);font:900 clamp(1rem,3vw,1.2rem) "Trebuchet MS",Arial,sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--line)}.word:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}.word.selected{background:#e4ddff;border-color:var(--purple);box-shadow:0 4px 0 #4f38ad}.word:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.actions{display:flex;justify-content:center;margin:24px 0 8px}.action{width:min(330px,100%);min-height:60px;border:3px solid var(--navy);border-radius:15px;background:var(--yellow);color:var(--navy);font:900 1.25rem "Trebuchet MS",Arial,sans-serif;box-shadow:0 5px 0 var(--navy);cursor:pointer}.action:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}.action.next{background:var(--green);color:white}
.feedback{min-height:74px;text-align:center;padding:13px;font-size:1.15rem;font-weight:900;border-radius:14px}.feedback.good{background:#dff7e8;color:#126d36}.feedback.bad{background:#fde4e4;color:#a12525}.answer{color:var(--navy)}
.finish{text-align:center;padding:70px 10px}.finish h2{font-size:clamp(2.5rem,10vw,5rem);margin:0}.trophy{font-size:5rem}.scorebig{font-size:3rem;font-weight:900;color:var(--purple);margin:15px}.finish p{font-size:1.25rem;font-weight:800}.hidden{display:none}.pop{animation:pop .35s ease}.confetti{position:fixed;top:-20px;width:12px;height:18px;animation:fall 1.4s linear forwards;z-index:10}@keyframes pop{50%{transform:scale(1.07)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:520px){body{padding:6px}main{min-height:calc(100vh - 12px);border-radius:18px;padding:14px}.stats{gap:5px}.pill{font-size:.85rem;padding:7px 9px}.sentence{margin:15px 0}.task{margin-top:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main>
<header><h1>Subject Quest</h1><div class="stats"><span class="pill" id="streak">🔥 0</span><span class="pill score" id="score">⭐ 0</span></div></header>
<section id="game">
<div class="meter"><span id="meter"></span></div>
<div class="task"><div class="step" id="step"></div><div class="prompt" id="prompt"></div></div>
<div class="sentence" id="sentence"></div><div class="words" id="words"></div>
<div class="actions"><button class="action" id="mainButton">CHECK</button></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
</section>
<section id="finish" class="finish hidden"><div class="trophy">🏆</div><h2>Great job!</h2><div class="scorebig" id="finalScore"></div><p id="finalMessage"></p><button class="action next" id="again">PLAY AGAIN</button></section>
</main>
<script>
const sentences=[
 {s:"Traffic police keep people safe.",cs:"Traffic police",ss:"police",sp:"keep",cp:"keep people safe"},
 {s:"A community provides goods and services.",cs:"A community",ss:"community",sp:"provides",cp:"provides goods and services"},
 {s:"The busy baker makes fresh bread.",cs:"The busy baker",ss:"baker",sp:"makes",cp:"makes fresh bread"},
 {s:"Our school teaches many students.",cs:"Our school",ss:"school",sp:"teaches",cp:"teaches many students"},
 {s:"A good neighbor helps others.",cs:"A good neighbor",ss:"neighbor",sp:"helps",cp:"helps others"},
 {s:"The town library lends books.",cs:"The town library",ss:"library",sp:"lends",cp:"lends books"},
 {s:"The friendly nurse cares for patients.",cs:"The friendly nurse",ss:"nurse",sp:"cares",cp:"cares for patients"},
 {s:"A local farmer grows food.",cs:"A local farmer",ss:"farmer",sp:"grows",cp:"grows food"},
 {s:"The fire department protects homes.",cs:"The fire department",ss:"department",sp:"protects",cp:"protects homes"},
 {s:"Our city government makes laws.",cs:"Our city government",ss:"government",sp:"makes",cp:"makes laws"},
 {s:"The grocery store sells food.",cs:"The grocery store",ss:"store",sp:"sells",cp:"sells food"},
 {s:"A school bus carries children.",cs:"A school bus",ss:"bus",sp:"carries",cp:"carries children"},
 {s:"Crossing guards help students.",cs:"Crossing guards",ss:"guards",sp:"help",cp:"help students"},
 {s:"The bus driver follows the route.",cs:"The bus driver",ss:"driver",sp:"follows",cp:"follows the route"},
 {s:"A caring doctor treats patients.",cs:"A caring doctor",ss:"doctor",sp:"treats",cp:"treats patients"},
 {s:"Our math teacher explains problems.",cs:"Our math teacher",ss:"teacher",sp:"explains",cp:"explains problems"},
 {s:"Brave firefighters stop fires.",cs:"Brave firefighters",ss:"firefighters",sp:"stop",cp:"stop fires"},
 {s:"The mail carrier delivers letters.",cs:"The mail carrier",ss:"carrier",sp:"delivers",cp:"delivers letters"},
 {s:"A skilled mechanic repairs cars.",cs:"A skilled mechanic",ss:"mechanic",sp:"repairs",cp:"repairs cars"},
 {s:"The police officer directs traffic.",cs:"The police officer",ss:"officer",sp:"directs",cp:"directs traffic"},
 {s:"A park ranger protects animals.",cs:"A park ranger",ss:"ranger",sp:"protects",cp:"protects animals"},
 {s:"Our mayor leads the city.",cs:"Our mayor",ss:"mayor",sp:"leads",cp:"leads the city"},
 {s:"The local store sells supplies.",cs:"The local store",ss:"store",sp:"sells",cp:"sells supplies"},
 {s:"A small restaurant serves meals.",cs:"A small restaurant",ss:"restaurant",sp:"serves",cp:"serves meals"},
 {s:"The sanitation crew collects trash.",cs:"The sanitation crew",ss:"crew",sp:"collects",cp:"collects trash"},
 {s:"Public workers serve the community.",cs:"Public workers",ss:"workers",sp:"serve",cp:"serve the community"},
 {s:"A large hospital treats sick people.",cs:"A large hospital",ss:"hospital",sp:"treats",cp:"treats sick people"},
 {s:"The school cafeteria serves lunch.",cs:"The school cafeteria",ss:"cafeteria",sp:"serves",cp:"serves lunch"},
 {s:"The animal shelter protects pets.",cs:"The animal shelter",ss:"shelter",sp:"protects",cp:"protects pets"},
 {s:"A neighborhood bank keeps money safe.",cs:"A neighborhood bank",ss:"bank",sp:"keeps",cp:"keeps money safe"},
 {s:"The town pharmacy sells medicine.",cs:"The town pharmacy",ss:"pharmacy",sp:"sells",cp:"sells medicine"},
 {s:"The road crew fixes streets.",cs:"The road crew",ss:"crew",sp:"fixes",cp:"fixes streets"},
 {s:"Our city council makes rules.",cs:"Our city council",ss:"council",sp:"makes",cp:"makes rules"},
 {s:"The friendly barber cuts hair.",cs:"The friendly barber",ss:"barber",sp:"cuts",cp:"cuts hair"},
 {s:"Our soccer coach teaches teamwork.",cs:"Our soccer coach",ss:"coach",sp:"teaches",cp:"teaches teamwork"},
 {s:"A fair judge decides cases.",cs:"A fair judge",ss:"judge",sp:"decides",cp:"decides cases"}
];
const types=[
 {key:"cs",label:"complete subject"},{key:"ss",label:"simple subject"},
 {key:"sp",label:"simple predicate"},{key:"cp",label:"complete predicate"}
];
let order=[],q=0,score=0,streak=0,locked=false,selected=new Set();const $=id=>document.getElementById(id);const clean=w=>w.replace(/[.,!?]/g,"");const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function buildRound(){const roundTypes=shuffle([...types,...types,...types]);return shuffle(sentences).slice(0,12).map((sentence,i)=>({sentence,type:roundTypes[i]}))}
function render(){locked=false;selected.clear();const item=order[q];$("meter").style.width=`${q/order.length*100}%`;$("step").textContent=`ROUND ${q+1} OF ${order.length}`;$("prompt").innerHTML=`Tap the <strong>${item.type.label}</strong>`;$("sentence").textContent=item.sentence.s;$("words").innerHTML="";item.sentence.s.split(" ").forEach((w,i)=>{const b=document.createElement("button");b.className="word";b.textContent=w;b.onclick=()=>{if(locked)return;b.classList.toggle("selected");b.classList.contains("selected")?selected.add(i):selected.delete(i)};$("words").appendChild(b)});$("feedback").className="feedback";$("feedback").textContent="";$("mainButton").className="action";$("mainButton").textContent="CHECK"}
function chosen(){return [...selected].sort((a,b)=>a-b).map(i=>clean(order[q].sentence.s.split(" ")[i])).join(" ")}function expected(){const item=order[q];return item.sentence[item.type.key]}
function celebrate(){document.querySelector("main").classList.remove("pop");void document.querySelector("main").offsetWidth;document.querySelector("main").classList.add("pop");for(let i=0;i<18;i++){const c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=["#ffd84d","#27ae60","#7357d8","#5fc9ff","#df4b4b"][i%5];c.style.animationDelay=Math.random()*.3+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),1800)}}
function check(){if(!selected.size){$("feedback").className="feedback bad";$("feedback").textContent="Tap your answer first!";return}locked=true;const right=chosen().toLowerCase()===expected().toLowerCase();if(right){streak++;const bonus=streak>=7?15:streak>=5?10:streak>=3?5:0;const points=10+bonus;score+=points;$("feedback").className="feedback good";$("feedback").textContent=bonus?`🔥 ${streak} STREAK! +${points} points (${bonus} bonus)`:`✅ CORRECT! +${points} points`;celebrate()}else{streak=0;$("feedback").className="feedback bad";$("feedback").innerHTML=`Answer: <span class="answer">${expected()}</span>`}$("score").textContent=`⭐ ${score}`;$("streak").textContent=`🔥 ${streak}`;$("mainButton").className="action next";$("mainButton").textContent="NEXT ROUND"}
function advance(){q++;if(q>=order.length)finish();else render()}$("mainButton").onclick=()=>locked?advance():check();
function finish(){$("meter").style.width="100%";$("game").classList.add("hidden");$("finish").classList.remove("hidden");$("finalScore").textContent=`⭐ ${score} points`;$("finalMessage").textContent=score>=150?"Grammar superstar!":"Play again and beat your score!";celebrate()}
function start(){order=buildRound();q=0;score=0;streak=0;$("score").textContent="⭐ 0";$("streak").textContent="🔥 0";$("game").classList.remove("hidden");$("finish").classList.add("hidden");render()}$("again").onclick=start;start();
</script></body></html>
