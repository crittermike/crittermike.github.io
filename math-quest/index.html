<script>
(function (root) {
'use strict';
const format = n => Number(n).toLocaleString('en-US');
function parseNumber(raw) {
  const s = String(raw ?? '').trim();
  if (!/^(?:\d+|\d{1,3}(?:,\d{3})+)$/.test(s)) return null;
  const n = Number(s.replace(/,/g, ''));
  return Number.isSafeInteger(n) ? n : null;
}
const roundTo = (n, place) => Math.floor((n + place / 2) / place) * place;
function toWords(n) {
  const small = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  if (n < 20) return small[n];
  if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? '-' + small[n % 10] : '');
  if (n < 1000) return small[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + toWords(n % 100) : '');
  return toWords(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? ', ' + toWords(n % 1000) : '');
}
// Fisher-Yates: copy first so practice never mutates the question bank.
function shuffle(values, rng = Math.random) {
  const out = [...values];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
const places = ['ones','tens','hundreds','thousands'];
const placeSingular = {10:'ten',100:'hundred',1000:'thousand'};
const units = {1:'ones',10:'tens',100:'hundreds',1000:'thousands'};
const concepts = ['units','composed','subtract100','add100','digitValue','digitPlace','expanded','wordsToNumber','numberToWords','compare','patternDown','patternUp','order','roundMulti','lineInterval','lineMidpoint','lineLocate','round10','round100','round1000','roundPlace','context'];
const labels = {
  units:'Unit bridge',composed:'Number builder',subtract100:'Hundred hop',add100:'Hundred hop',
  digitValue:'Digit treasure',digitPlace:'Place-value peak',expanded:'Number builder',
  wordsToNumber:'Word wizard',numberToWords:'Word wizard',compare:'Compare canyon',
  patternDown:'Pattern trail',patternUp:'Pattern trail',order:'Order crossing',roundMulti:'Rounding grove',
  lineInterval:'Number-line lookout',lineMidpoint:'Halfway hill',lineLocate:'Number-line lookout',
  round10:'Rounding grove',round100:'Rounding grove',round1000:'Rounding grove',roundPlace:'Rounding grove',context:'Story summit'
};
function numericChoices(answer, candidates, rng) {
  const values = [...new Set([answer, ...candidates].filter(n => Number.isInteger(n) && n >= 0 && n <= 10000))];
  for (let step = 1; values.length < 4; step++) {
    const n = answer + step <= 10000 ? answer + step : answer - step;
    if (!values.includes(n)) values.push(n);
  }
  return shuffle(values.slice(0,4), rng);
}
function makeQuestion(data, rng = Math.random) {
  const d = {...data};
  const q = {id:d.id,concept:d.concept,data:d,type:'number',label:labels[d.concept]};
  switch (d.concept) {
    case 'units':
      q.prompt = `${format(d.n / (d.givenUnit || 1))} ${units[d.givenUnit || 1]} = ___ ${units[d.unit]}`;
      q.answer = d.n / d.unit;
      q.strategy = `First find the number of ones. Each ${units[d.unit] === 'ones' ? 'one is 1' : placeSingular[d.unit] + ' is ' + format(d.unit)}. ${format(d.n)} ÷ ${format(d.unit)} = ${format(q.answer)}.`;
      break;
    case 'composed': case 'expanded':
      q.answer = d.terms.reduce((sum,n) => sum + n, 0);
      q.prompt = d.concept === 'expanded' ? `Write ${d.terms.map(format).join(' + ')} as one number.` : `Write as one number: ${d.terms.map((n,i) => `${n / 10 ** (3-i)} ${places[3-i]}`).join(' + ')}.`;
      q.strategy = `Line up thousands, hundreds, tens, and ones. Use 0 for an empty place. ${d.terms.map(format).join(' + ')} = ${format(q.answer)}.`;
      break;
    case 'subtract100': case 'add100': {
      const sign = d.concept === 'add100' ? 1 : -1;
      q.prompt = `${format(d.n)} ${sign === 1 ? '+' : '−'} 100 = ___`;
      q.answer = d.n + sign * 100;
      q.strategy = `Move ${sign === 1 ? 'forward' : 'back'} one hundred. Regroup at a thousand boundary; the tens and ones stay the same. The result is ${format(q.answer)}.`;
      break;
    }
    case 'digitValue': {
      const digit = Math.floor(d.n / 10 ** d.position) % 10;
      q.prompt = `In ${format(d.n)}, the ${places[d.position]} digit is ${digit}. What is its value?`;
      q.answer = digit * 10 ** d.position;
      q.type = 'mcq';
      q.choices = numericChoices(q.answer, [digit, digit*10, digit*100, digit*1000], rng);
      q.strategy = `Value means how much a digit is worth. ${digit} × ${format(10 ** d.position)} = ${format(q.answer)}.`;
      break;
    }
    case 'digitPlace': {
      const digit = Math.floor(d.n / 10 ** d.position) % 10;
      q.prompt = `Which place is the digit ${digit} in: ${format(d.n)}?`;
      q.answer = places[d.position]; q.type = 'mcq'; q.choices = shuffle(places,rng);
      q.strategy = `From the right, name the places: ones, tens, hundreds, thousands. The ${digit} is in the ${q.answer} place.`;
      break;
    }
    case 'wordsToNumber':
      q.prompt = `Write in digits: ${toWords(d.n)}.`; q.answer = d.n;
      q.strategy = `Put each part in its place. Empty places need a zero: ${format(d.n)}.`;
      break;
    case 'numberToWords':
      q.prompt = `Which words name ${format(d.n)}?`; q.answer = toWords(d.n); q.type = 'mcq';
      q.choices = numericChoices(d.n,[d.n+100,d.n-100,d.n+1000,d.n-1000],rng).map(toWords);
      q.strategy = `Read the thousands first, then the hundreds, tens, and ones: ${q.answer}. Forty has no u.`;
      break;
    case 'compare':
      q.prompt = `Choose the sign: ${d.leftText} ___ ${d.rightText}`;
      q.answer = d.left === d.right ? '=' : d.left > d.right ? '>' : '<'; q.type = 'mcq'; q.choices = ['<','=','>'];
      q.strategy = `Convert both sides to ones: ${format(d.left)} ${q.answer} ${format(d.right)}. The open side of < or > faces the larger number.`;
      break;
    case 'patternDown': case 'patternUp':
      q.prompt = 'Find the missing number in the pattern.';
      q.sequence = Array.from({length:6},(_,i) => i === d.missing ? '___' : format(d.start+d.step*i));
      q.answer = d.start + d.step * d.missing;
      q.strategy = `Each step ${d.step > 0 ? 'adds' : 'subtracts'} ${format(Math.abs(d.step))}. Count one step at a time to reach ${format(q.answer)}.`;
      break;
    case 'order':
      q.prompt = 'Tap numbers from least to greatest.'; q.type = 'order';
      q.answer = [...d.values].sort((a,b) => a-b); q.choices = shuffle(d.values,rng);
      q.strategy = `Compare thousands first, then hundreds, tens, and ones. The path is ${q.answer.map(format).join(' → ')}.`;
      break;
    case 'roundMulti':
      q.prompt = `Select ALL numbers that round to ${format(d.target)} to the nearest ${placeSingular[d.place]}.`;
      q.type = 'multi'; q.choices = shuffle(d.values,rng);
      q.answer = d.values.filter(n => roundTo(n,d.place) === d.target);
      q.strategy = `Look one place to the right. 0 to 4: round down. 5 to 9: round up. The matching numbers are ${q.answer.map(format).join(', ')}.`;
      break;
    case 'lineInterval':
      q.prompt = 'How much is one small step between neighboring ticks?';
      q.line = d.line; q.answer = (d.line.end-d.line.start)/d.line.ticks;
      q.strategy = `Count the spaces, not the tick marks. Divide the distance by the spaces: ${format(d.line.end-d.line.start)} ÷ ${d.line.ticks} = ${format(q.answer)}.`;
      break;
    case 'lineMidpoint':
      q.prompt = `${format(d.mid)} is halfway between ${format(d.left)} and which number?`;
      q.answer = d.mid + (d.mid-d.left);
      q.line = {start:d.left,end:q.answer,ticks:10,labels:[{value:d.left,text:format(d.left)},{value:d.mid,text:format(d.mid)},{value:q.answer,text:'?'}]};
      q.strategy = `Both halves have the same length. ${format(d.mid)} − ${format(d.left)} = ${format(d.mid-d.left)}. Add that distance again to get ${format(q.answer)}.`;
      break;
    case 'lineLocate':
      q.prompt = `Which letter marks ${format(d.target)} on the number line?`;
      q.type = 'mcq'; q.line = {...d.line,markers:d.markers}; q.choices = d.markers.map(m => m.label);
      q.answer = d.markers.find(m => m.value === d.target).label;
      q.strategy = `Each small space is ${format((d.line.end-d.line.start)/d.line.ticks)}. Start at a labeled tick and count equal steps to ${format(d.target)}: letter ${q.answer}.`;
      break;
    case 'round10': case 'round100': case 'round1000': case 'context':
      q.prompt = d.concept === 'context' ? `A food stand sold ${format(d.n)} tacos. About how many is that, rounded to the nearest ${placeSingular[d.place]}?` : `Round ${format(d.n)} to the nearest ${placeSingular[d.place]}.`;
      q.answer = roundTo(d.n,d.place);
      q.strategy = `Look at the ${places[Math.log10(d.place)-1]} digit. 0 to 4: round down. 5 to 9: round up. ${format(d.n)} is about ${format(q.answer)} to the nearest ${placeSingular[d.place]}.`;
      break;
    case 'roundPlace':
      q.prompt = `${format(d.n)} rounds to ${format(d.target)}. To which place was it rounded?`;
      q.type = 'mcq'; q.choices = ['ten','hundred','thousand'];
      q.answer = placeSingular[[10,100,1000].find(p => roundTo(d.n,p) === d.target)];
      q.strategy = `Try each place: nearest ten is ${format(roundTo(d.n,10))}, hundred is ${format(roundTo(d.n,100))}, and thousand is ${format(roundTo(d.n,1000))}. Choose ${q.answer}.`;
      break;
    default: throw new Error('Unknown question concept: '+d.concept);
  }
  return q;
}
function line(start=1000,step=100,ticks=20) {
  const end = start+step*ticks;
  return {start,end,ticks,labels:[{value:start,text:format(start)},{value:start+step*10,text:format(start+step*10)},{value:start+step*20,text:format(start+step*20)}]};
}
// Worksheet examples are exclusion fixtures, never playable questions.
function buildExamples(rng = Math.random) {
  const specs = [
    {id:'units-4300',concept:'units',n:4300,unit:10},
    {id:'units-210',concept:'units',n:210*10,givenUnit:10,unit:1},
    {id:'composed-5164',concept:'composed',terms:[5*1000,1*100,6*10,4]},
    {id:'subtract-9006',concept:'subtract100',n:9006},
    {id:'add-995',concept:'add100',n:995},
    ...[4,6,1,5].map((digit,position) => ({id:'value-'+digit,concept:'digitValue',n:5164,position})),
    {id:'value-7543',concept:'digitValue',n:7543,position:1},
    {id:'place-6912',concept:'digitPlace',n:6912,position:3},
    {id:'expanded-3214',concept:'expanded',terms:[10,200,3000,4]},
    {id:'expanded-8206',concept:'expanded',terms:[8000,6,200]},
    {id:'words-5005',concept:'wordsToNumber',n:5005},
    {id:'word-4348',concept:'numberToWords',n:4348},
    {id:'compare-equal',concept:'compare',left:4*1000+2*10,right:20+40*100,leftText:'4 thousands + 2 tens',rightText:'20 ones + 40 hundreds'},
    {id:'compare-regroup',concept:'compare',left:25*100+10*10,right:100+3*1000,leftText:'25 hundreds + 10 tens',rightText:'100 ones + 3 thousands'},
    ...[2,3,5].map(missing => ({id:'down-'+missing,concept:'patternDown',start:5009,step:-1000,missing})),
    ...[2,3,5].map(missing => ({id:'up-'+missing,concept:'patternUp',start:4374,step:100,missing})),
    {id:'order-guide',concept:'order',values:[3421,1234,2413,2341,3412]},
    {id:'multi-80',concept:'roundMulti',values:[72,82,79,74,75,85],place:10,target:80},
    {id:'line-interval',concept:'lineInterval',line:line()},
    {id:'line-midpoint',concept:'lineMidpoint',left:1500,mid:2000},
    {id:'line-locate',concept:'lineLocate',line:line(1000,100,22),target:3100,markers:[{label:'A',value:1300},{label:'B',value:1900},{label:'C',value:2400},{label:'D',value:3100}]},
    {id:'round-4348',concept:'round100',n:4348,place:100},
    {id:'round-4683',concept:'round10',n:4683,place:10},
    {id:'round-85',concept:'round10',n:85,place:10},
    {id:'round-4521',concept:'round1000',n:4521,place:1000},
    {id:'round-9500',concept:'round1000',n:9500,place:1000},
    {id:'tacos-1995',concept:'context',n:1995,place:10},
